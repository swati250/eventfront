
    <div class="card shadow" style="margin: auto;">
    <div class="row-justify-content-center">
      
    <div class="container mt-5">
    
    
      
      <h2 class="text-center text-primary"> Admin Login Form</h2>
      <form action="/submit-form" method="POST" (ngSubmit)="submitdata()">
       
        <!-- Email -->
    
        <div class="mb-3">
          <label for="email">Email:</label>
          <input type="email" class="form-control" id="email" name="email" required [(ngModel)]="a.email" >
        </div>
        
          
      
    
        <div class="mb-3">
          <label for="pwd" class="form-label">Password:</label>
          <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd" [(ngModel)]="a.password">
        </div>
       
        <!-- Submit Button -->
        <div class="button-container">
          <button type="submit">Submit</button>
         
      </div>
      
    
        
        
      </form>
    </div>
    </div>
    </div>
