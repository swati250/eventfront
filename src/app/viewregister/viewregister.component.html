<div class="container">
    <h2 class="text-center">Register Table </h2><br>
    <table class="table table-bordered text-center">
        <thead>
            <tr><th> Id </th>
                <th> Name</th>
                <th> Address</th>
                <th>Email Address</th>
                <th>contact no</th>
                

            </tr>
        </thead>

       <tbody>
        <tr *ngFor="let r of rarr">
            <td>{{r.id}}</td>
            <td>{{r.name}}</td>
            <td>{{r.address}}</td>
            <td>{{r.email}}</td>
            <td>{{r.contactno}}</td>
            
        </tr>
           </tbody>
    </table>
</div>
