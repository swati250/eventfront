<div class="container py-5">
    <div class="row justify-content-center">
        <!-- Contact Information Container -->
        <div class="col-md-6 bg-secondary text-white p-4 rounded-start">
            <h3 class="mb-4">Get in Touch</h3>
            <p><strong>Address:</strong> 123 Street, City, Country</p>
            <p><strong>Email:</strong> contact&#64;example.com</p>
            <p><strong>Phone:</strong> +123 456 7890</p>
            <p><strong>instagram:</strong> eventplanner ig</p>
            <p><strong>facebook:</strong> eventplanner fb</p>
  
            
        </div>
  
        <!-- Contact Form Container -->
        <div class="col-md-6 bg-white p-4 rounded-end shadow">
            <h3 class="mb-4">Contact Us</h3>
            <form #conForm="ngForm" (ngSubmit)="submitdata(conForm)">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Your Name" name="nm" #name="ngModel"    [(ngModel)]="c.name">
                </div>
                <div *ngIf="!name.valid" style="color:red;">
                    <div *ngIf="name.errors?.['required']">
                           name is required
                    </div>
                  <div *ngIf="name.errors?.['pattern']">
                       Name can contain only alphabets
                  </div>
                        </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email </label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" name="email" #email="ngModel"  ngModel required  [(ngModel)]="c.email">
                </div>
                <div *ngIf="!email.valid" style="color:red;">
                    <div *ngIf="email.errors?.['required']">
                           email is required
                    </div>
                    <div *ngIf="email.errors?.['pattern']">
                      emailid must be valid 
                 </div>
                        </div>
                
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="4" placeholder="Your message" name="message" #message="ngModel"  ngModel required  [(ngModel)]="c.message">
                    </textarea>
                </div>
                <div *ngIf="!message.valid" style="color:red;">
                    <div *ngIf="message.errors?.['required']">
                           message is required
                    </div>
                    <div *ngIf="message.errors?.['pattern']">
                      message must be valid 
                 </div>
                        </div>
  
                <button type="submit"  [disabled]="!conForm.valid" class="btn btn-primary margin-left" >Submit</button>
            </form>
        </div>
    
    </div>
  </div>
